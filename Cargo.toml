[package]
name = "subhunter"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3.5.2"
hickory-resolver = "0.26.3"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
